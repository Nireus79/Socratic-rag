[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-rag"
version = "0.1.7"
description = "Small vector-search layer (ChromaDB and sentence-transformers) extracted from the Socrates prototype (research prototype)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Efthimios Angelopoulos", email = "Hermes_creative@proton.me"}
]
keywords = ["rag", "retrieval-augmented-generation", "nlp", "embeddings", "vector-database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20.0",
    "sentence-transformers>=2.0.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
# Only needed by connection_pool.py and read_write_split.py
database = ["sqlalchemy>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0,<26",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/Nireus79/Socratic-rag"
Documentation = "https://github.com/Nireus79/Socratic-rag#readme"
Repository = "https://github.com/Nireus79/Socratic-rag.git"
Issues = "https://github.com/Nireus79/Socratic-rag/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP006", "UP035"]  # Line too long (handled by black), Use list instead of List (for 3.8 compat), Use dict instead of Dict (for 3.8 compat)

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
]
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "chromadb",
    "chromadb.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "PyPDF2",
    "faiss",
    "langchain.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/socratic_rag --cov-report=term-missing --cov-report=html -v"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
